appId: invalid.example.questify.ios
---
# Welcome after a local consent agree. The confirm button agrees to both documents.
# Role, settings, browse, and draft entries are asserted and not opened. No
# typed text, credential entry, payment, or host URL.
- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "authEntry.gate.lead"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "authEntry.gate.agree"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "authEntry.gate.agree"
- extendedWaitUntil:
    visible:
      id: "welcome.player"
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: "authEntry.gate.lead"
    timeout: 10000
- assertVisible:
    id: "welcome.merchant"
- assertVisible:
    id: "welcome.settings"
- assertVisible:
    id: "language.switcher"
- scrollUntilVisible:
    element:
      id: "ownerDraft.guestEntry"
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: "ownerDraft.guestEntry"
- scrollUntilVisible:
    element:
      id: "welcome.browse"
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: "welcome.browse"
