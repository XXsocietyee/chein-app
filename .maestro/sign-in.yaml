appId: invalid.example.questify.ios
---
# Opens sign-in and the phone sheet. The confirm button agrees to both documents.
# Does not type, and does not tap credential submission, send code, phone
# sign-in, Apple, or WeChat. No payment and no host URL. Phone identifiers
# match the committed default market CN.
- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "authEntry.gate.lead"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "authEntry.gate.agree"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "authEntry.gate.agree"
- extendedWaitUntil:
    visible:
      id: "welcome.player"
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: "authEntry.gate.lead"
    timeout: 10000
- tapOn:
    id: "welcome.player"
- extendedWaitUntil:
    visible:
      id: "auth.wechat.signIn"
    timeout: 10000
- assertVisible:
    id: "auth.wechat.signIn"
- scrollUntilVisible:
    element:
      id: "auth.otherChannels"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "auth.otherChannels"
- extendedWaitUntil:
    visible:
      id: "auth.channels.phone"
    timeout: 10000
- assertVisible:
    id: "auth.channels.code"
- scrollUntilVisible:
    element:
      id: "auth.channels.sendCode"
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: "auth.channels.sendCode"
- scrollUntilVisible:
    element:
      id: "auth.channels.phoneSignIn"
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: "auth.channels.phoneSignIn"
