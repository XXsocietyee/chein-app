appId: invalid.example.questify.ios
---
# Cold start. The lead is on screen. The generated launch screen has no
# accessibility identifier. clearState and clearKeychain keep a saved token
# from being restored. No launch arguments, typed text, payment, or host URL.
# Decline is not tapped.
- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "authEntry.gate.lead"
    timeout: 20000
- assertVisible:
    id: "authEntry.gate.privacyGuide"
- scrollUntilVisible:
    element:
      id: "authEntry.gate.decline"
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: "authEntry.gate.decline"
