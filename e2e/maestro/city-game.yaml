appId: invalid.example.questify.ios
name: City Game (Official City Read & Participation)
tags:
  - e2e
  - city-game
---
# City Game flow covers CityPlayerView (`city.read.screen`, `city.orderedMap.entry`,
# `city.participation.entry`, `city.actionBudget.entry`, `city.value.entry`) and CityMerchant/Search city layers.
- launchApp:
    clearState: false
    arguments:
      "--e2e-test-host": "https://8120-agqyfqxs5vwolymtoibzq3fhde.instabox.tech"

# Switch to Roam tab via native tab bar ID, open `roam.more` -> `roam.more.city`.
- extendedWaitUntil:
    visible:
      id: "rootTabBar.tab.player.1"
    timeout: 15000
- tapOn:
    id: "rootTabBar.tab.player.1"

- extendedWaitUntil:
    visible:
      id: "roam.more"
    timeout: 15000
- tapOn:
    id: "roam.more"
- extendedWaitUntil:
    visible:
      id: "roam.more.city"
    timeout: 8000
- tapOn:
    id: "roam.more.city"

- extendedWaitUntil:
    visible:
      id: "city.read.screen"
    timeout: 15000
- runFlow:
    when:
      visible:
        id: "city.participation.entry"
    commands:
      - assertVisible:
          id: "city.participation.entry"

# Also verify city search & public map layers in SearchMapExplorerView.
- back
- tapOn:
    id: "roam.search"
- extendedWaitUntil:
    visible:
      id: "searchMap.citySearch"
    timeout: 10000
- tapOn:
    id: "searchMap.citySearch"

# Verify public map layers in SearchMapExplorerView if present.
- runFlow:
    when:
      visible:
        id: "mapLayers.cityPlaces"
    commands:
      - tapOn:
          id: "mapLayers.cityPlaces"
      - assertVisible:
          id: "mapViewport.search"
- runFlow:
    when:
      visible:
        id: "globalSearch.close"
    commands:
      - tapOn:
          id: "globalSearch.close"
