appId: invalid.example.questify.ios
name: Workshop Purchased / Install
tags:
  - e2e
  - workshop
---
# Assumes signed-in session (run after login.yaml).
# Known TEST backend status (docs/release/e2e/E2E-20261113b.md N4):
# - Empty-catalog / purchased-library state has dedicated identifiers tested once inside Settings.
- launchApp:
    clearState: false
    arguments:
      "--e2e-test-host": "https://8120-agqyfqxs5vwolymtoibzq3fhde.instabox.tech"

# Switch to Passport tab and open Settings via `account.settings`.
- extendedWaitUntil:
    visible:
      id: "rootTabBar.tab.player.3"
    timeout: 15000
- tapOn:
    id: "rootTabBar.tab.player.3"
- extendedWaitUntil:
    visible:
      id: "account.settings"
    timeout: 15000
- tapOn:
    id: "account.settings"

# Open Workshop Purchased Library (`account.workshopPurchased`).
- scrollUntilVisible:
    element:
      id: "account.workshopPurchased"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "account.workshopPurchased"

# Verify purchased rows and paid install flow if catalog items exist.
- runFlow:
    when:
      visible:
        id: "workshopPurchased.row\\..*"
    commands:
      - tapOn:
          id: "workshopPurchased.row\\..*"
      - extendedWaitUntil:
          visible:
            id: "workshopPurchased.status"
          timeout: 10000
      - runFlow:
          when:
            visible:
              id: "workshopPaidInstall.entry"
          commands:
            - tapOn:
                id: "workshopPaidInstall.entry"
            - extendedWaitUntil:
                visible:
                  id: "workshopPaidInstall.authority"
                timeout: 10000
            - tapOn:
                id: "workshopPaidInstall.confirm"
