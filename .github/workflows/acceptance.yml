name: Acceptance
on:
  # 11-26: no longer on every ui/combined-r7 or port/** push. The coordinator pushes ci/acceptance about twice a day
  # (or on demand) so checks don't pile up on the shared Mac.
  push:
    branches:
      - ci/acceptance
      - ci/baseline-record
permissions:
  contents: read
env:
  ACCEPTANCE_MODE: ${{ github.ref == 'refs/heads/ci/baseline-record' && 'record' || 'check' }}
jobs:
  hosted-probe:
    # 11-26: can GitHub's free macOS runners (public repo) build this project? Reports Xcode + iOS runtimes only.
    runs-on: macos-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Xcode and simulators on the hosted image
        run: |
          sw_vers
          ls -d /Applications/Xcode*.app || true
          xcodebuild -version
          xcrun simctl list runtimes | head -20
          df -h / | tail -1
  baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        id: checkout_try1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        continue-on-error: true
        with:
          persist-credentials: 'false'
          fetch-depth: 1
      - name: Back off before checkout retry
        if: steps.checkout_try1.outcome == 'failure'
        run: sleep 10
      - name: Checkout retry
        id: checkout_try2
        if: steps.checkout_try1.outcome == 'failure'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        continue-on-error: true
        with:
          persist-credentials: 'false'
          fetch-depth: 1
      - name: Back off before the last checkout retry
        if: steps.checkout_try1.outcome == 'failure' && steps.checkout_try2.outcome == 'failure'
        run: sleep 20
      - name: Checkout last retry
        if: steps.checkout_try1.outcome == 'failure' && steps.checkout_try2.outcome == 'failure'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: 'false'
          fetch-depth: 1
      - name: Acceptance mode
        run: echo "ACCEPTANCE_MODE=$ACCEPTANCE_MODE ref=$GITHUB_REF"
      - name: Check mode requires baseline files
        run: |
          set -euo pipefail
          if [ "$ACCEPTANCE_MODE" != "check" ]; then
            echo "record mode: a missing baseline is not a failure"
            exit 0
          fi
          missing=0
          for path in docs/release/baselines/core.txt docs/release/baselines/appunit.txt; do
            if [ ! -f "$path" ]; then
              echo "baseline missing: $path"
              missing=1
            fi
          done
          exit "$missing"

  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        id: checkout_try1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        continue-on-error: true
        with:
          persist-credentials: 'false'
          fetch-depth: 1
      - name: Back off before checkout retry
        if: steps.checkout_try1.outcome == 'failure'
        run: sleep 10
      - name: Checkout retry
        id: checkout_try2
        if: steps.checkout_try1.outcome == 'failure'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        continue-on-error: true
        with:
          persist-credentials: 'false'
          fetch-depth: 1
      - name: Back off before the last checkout retry
        if: steps.checkout_try1.outcome == 'failure' && steps.checkout_try2.outcome == 'failure'
        run: sleep 20
      - name: Checkout last retry
        if: steps.checkout_try1.outcome == 'failure' && steps.checkout_try2.outcome == 'failure'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: 'false'
          fetch-depth: 1
      - name: Acceptance mode
        run: echo "ACCEPTANCE_MODE=$ACCEPTANCE_MODE ref=$GITHUB_REF"
      - name: Scaffold
        run: python3 -B tools/check_scaffold.py
      - name: Typography lint
        run: python3 -B tools/check_typography_lint.py
      - name: Accessibility lint
        run: python3 -B tools/check_a11y_lint.py
      - name: Record the known contract-ratchet failure
        if: env.ACCEPTANCE_MODE == 'record'
        run: python3 -B .github/acceptance_support.py record-contract --baseline docs/release/contract-failing-baseline.txt
      - name: Contract ratchet
        run: python3 -B tools/contract_ratchet.py --check

  debug-build:
    runs-on: [self-hosted, macOS, ARM64, chengyin-app]
    concurrency:
      group: acceptance-debug-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 50
    steps:
      - name: Checkout
        id: checkout_try1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        continue-on-error: true
        with:
          persist-credentials: 'false'
          fetch-depth: 1
      - name: Back off before checkout retry
        if: steps.checkout_try1.outcome == 'failure'
        run: sleep 10
      - name: Checkout retry
        id: checkout_try2
        if: steps.checkout_try1.outcome == 'failure'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        continue-on-error: true
        with:
          persist-credentials: 'false'
          fetch-depth: 1
      - name: Back off before the last checkout retry
        if: steps.checkout_try1.outcome == 'failure' && steps.checkout_try2.outcome == 'failure'
        run: sleep 20
      - name: Checkout last retry
        if: steps.checkout_try1.outcome == 'failure' && steps.checkout_try2.outcome == 'failure'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: 'false'
          fetch-depth: 1
      - name: Print Xcode version
        run: xcodebuild -version
      - name: Simulator destination
        run: python3 -B .github/acceptance_support.py destination --lane lane2 --out simulator-destination.txt
      - name: Debug simulator build
        run: |
          set -euo pipefail
          set -o pipefail
          dest="$(tr -d '\n' < simulator-destination.txt)"
          private="${RUNNER_TEMP}/derived-build"
          xcodebuild -project Questify.xcodeproj -scheme Questify -configuration Debug -sdk iphonesimulator -destination "$dest" -derivedDataPath "$private" -resultBundlePath debug-build.xcresult CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build-for-testing | tee debug-build.log
          python3 -B .github/acceptance_support.py publish-derived --src "$private" --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        continue-on-error: true
        with:
          name: debug-build
          path: |
            debug-build.log
            debug-build.xcresult
          if-no-files-found: ignore

  core-tests:
    needs: baselines
    runs-on: [self-hosted, macOS, ARM64, chengyin-app]
    concurrency:
      group: acceptance-core-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 50
    steps:
      - name: Checkout
        id: checkout_try1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        continue-on-error: true
        with:
          persist-credentials: 'false'
          fetch-depth: 1
      - name: Back off before checkout retry
        if: steps.checkout_try1.outcome == 'failure'
        run: sleep 10
      - name: Checkout retry
        id: checkout_try2
        if: steps.checkout_try1.outcome == 'failure'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        continue-on-error: true
        with:
          persist-credentials: 'false'
          fetch-depth: 1
      - name: Back off before the last checkout retry
        if: steps.checkout_try1.outcome == 'failure' && steps.checkout_try2.outcome == 'failure'
        run: sleep 20
      - name: Checkout last retry
        if: steps.checkout_try1.outcome == 'failure' && steps.checkout_try2.outcome == 'failure'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: 'false'
          fetch-depth: 1
      - name: Print Xcode version
        run: xcodebuild -version
      - name: Core package tests
        run: |
          set -euo pipefail
          set +e
          swift test --package-path . 2>&1 | tee core-tests.log
          code="${PIPESTATUS[0]}"
          set -e
          echo "$code" > core-exit.txt
          exit 0
      - name: Collect failing names
        id: collect
        if: always()
        run: python3 -B .github/acceptance_support.py collect --log core-tests.log --exit core-exit.txt --failures-out core-failures.txt --status-out core-status.txt
      - name: Compare with baseline
        id: gate
        if: steps.collect.outcome == 'success'
        run: python3 -B .github/acceptance_support.py gate --mode "$ACCEPTANCE_MODE" --baseline docs/release/baselines/core.txt --failures core-failures.txt --status core-status.txt --record baseline-core.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ steps.gate.outcome == 'success' && env.ACCEPTANCE_MODE == 'record' }}
        with:
          name: baseline-core.txt
          path: baseline-core.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        continue-on-error: true
        with:
          name: core-tests-log
          path: |
            core-tests.log
            core-failures.txt
          if-no-files-found: ignore

  appunit-lane-lane2:
    name: AppUnit Lane2
    needs: [baselines, debug-build]
    runs-on: [self-hosted, macOS, ARM64, chengyin-app]
    concurrency:
      group: acceptance-lane2-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 50
    steps:
      - name: Checkout
        id: checkout_try1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        continue-on-error: true
        with:
          persist-credentials: 'false'
          fetch-depth: 1
      - name: Back off before checkout retry
        if: steps.checkout_try1.outcome == 'failure'
        run: sleep 10
      - name: Checkout retry
        id: checkout_try2
        if: steps.checkout_try1.outcome == 'failure'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        continue-on-error: true
        with:
          persist-credentials: 'false'
          fetch-depth: 1
      - name: Back off before the last checkout retry
        if: steps.checkout_try1.outcome == 'failure' && steps.checkout_try2.outcome == 'failure'
        run: sleep 20
      - name: Checkout last retry
        if: steps.checkout_try1.outcome == 'failure' && steps.checkout_try2.outcome == 'failure'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: 'false'
          fetch-depth: 1
      - name: Print Xcode version
        run: xcodebuild -version
      - name: Restore DerivedData
        run: python3 -B .github/acceptance_support.py restore-derived --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --dest "$RUNNER_TEMP/derived-lane2"
      - name: Simulator destination
        run: python3 -B .github/acceptance_support.py destination --lane lane2 --out simulator-destination.txt
      - name: AppUnit shards 0 and 1
        run: |
          set -euo pipefail
          derived="${RUNNER_TEMP}/derived-lane2"
          dest="$(tr -d '\n' < simulator-destination.txt)"
          fail=0
          run="$(python3 -B .github/acceptance_support.py xctestrun --derived "$derived")"
          for shard in 0 1; do
            python3 -B .github/acceptance_support.py only-testing --shard "$shard" > "only-testing-${shard}.args"
            set +e
            set -o pipefail
            python3 -B .github/acceptance_support.py simulator-lock --prepare-from simulator-destination.txt -- xcodebuild test-without-building -xctestrun "$run" -destination "$dest" -resultBundlePath "appunit-${shard}.xcresult" -parallel-testing-enabled NO -skip-testing:QuestifyUITests $(cat "only-testing-${shard}.args") | tee "appunit-${shard}.log"
            code="${PIPESTATUS[0]}"
            set -e
            echo "$code" > "appunit-${shard}-exit.txt"
            python3 -B .github/acceptance_support.py collect --log "appunit-${shard}.log" --exit "appunit-${shard}-exit.txt" --failures-out "appunit-${shard}-failures.txt" --status-out "appunit-${shard}-status.txt" || fail=1
          done
          exit "$fail"
      - name: Record AppUnit shard status
        if: always()
        run: python3 -B .github/acceptance_support.py materialize-shard-status --shard 0 --shard 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: appunit-failures-0
          path: |
            appunit-0-failures.txt
            appunit-0-status.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: appunit-failures-1
          path: |
            appunit-1-failures.txt
            appunit-1-status.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        continue-on-error: true
        with:
          name: appunit-shard-0
          path: |
            appunit-0.log
            appunit-0.xcresult
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        continue-on-error: true
        with:
          name: appunit-shard-1
          path: |
            appunit-1.log
            appunit-1.xcresult
          if-no-files-found: ignore

  appunit-lane-w2:
    name: AppUnit W2
    needs: [baselines, debug-build]
    runs-on: [self-hosted, macOS, ARM64, chengyin-app]
    concurrency:
      group: acceptance-w2-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 50
    steps:
      - name: Checkout
        id: checkout_try1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        continue-on-error: true
        with:
          persist-credentials: 'false'
          fetch-depth: 1
      - name: Back off before checkout retry
        if: steps.checkout_try1.outcome == 'failure'
        run: sleep 10
      - name: Checkout retry
        id: checkout_try2
        if: steps.checkout_try1.outcome == 'failure'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        continue-on-error: true
        with:
          persist-credentials: 'false'
          fetch-depth: 1
      - name: Back off before the last checkout retry
        if: steps.checkout_try1.outcome == 'failure' && steps.checkout_try2.outcome == 'failure'
        run: sleep 20
      - name: Checkout last retry
        if: steps.checkout_try1.outcome == 'failure' && steps.checkout_try2.outcome == 'failure'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: 'false'
          fetch-depth: 1
      - name: Print Xcode version
        run: xcodebuild -version
      - name: Restore DerivedData
        run: python3 -B .github/acceptance_support.py restore-derived --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --dest "$RUNNER_TEMP/derived-w2"
      - name: Simulator destination
        run: python3 -B .github/acceptance_support.py destination --lane w2 --out simulator-destination.txt
      - name: AppUnit shards 2 and 3
        run: |
          set -euo pipefail
          derived="${RUNNER_TEMP}/derived-w2"
          dest="$(tr -d '\n' < simulator-destination.txt)"
          fail=0
          run="$(python3 -B .github/acceptance_support.py xctestrun --derived "$derived")"
          for shard in 2 3; do
            python3 -B .github/acceptance_support.py only-testing --shard "$shard" > "only-testing-${shard}.args"
            set +e
            set -o pipefail
            python3 -B .github/acceptance_support.py simulator-lock --prepare-from simulator-destination.txt -- xcodebuild test-without-building -xctestrun "$run" -destination "$dest" -resultBundlePath "appunit-${shard}.xcresult" -parallel-testing-enabled NO -skip-testing:QuestifyUITests $(cat "only-testing-${shard}.args") | tee "appunit-${shard}.log"
            code="${PIPESTATUS[0]}"
            set -e
            echo "$code" > "appunit-${shard}-exit.txt"
            python3 -B .github/acceptance_support.py collect --log "appunit-${shard}.log" --exit "appunit-${shard}-exit.txt" --failures-out "appunit-${shard}-failures.txt" --status-out "appunit-${shard}-status.txt" || fail=1
          done
          exit "$fail"
      - name: Record AppUnit shard status
        if: always()
        run: python3 -B .github/acceptance_support.py materialize-shard-status --shard 2 --shard 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: appunit-failures-2
          path: |
            appunit-2-failures.txt
            appunit-2-status.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: appunit-failures-3
          path: |
            appunit-3-failures.txt
            appunit-3-status.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        continue-on-error: true
        with:
          name: appunit-shard-2
          path: |
            appunit-2.log
            appunit-2.xcresult
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        continue-on-error: true
        with:
          name: appunit-shard-3
          path: |
            appunit-3.log
            appunit-3.xcresult
          if-no-files-found: ignore

  appunit-baseline:
    needs: [appunit-lane-lane2, appunit-lane-w2]
    if: ${{ always() && !cancelled() && needs.appunit-lane-lane2.result != 'skipped' && needs.appunit-lane-w2.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        id: checkout_try1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        continue-on-error: true
        with:
          persist-credentials: 'false'
          fetch-depth: 1
      - name: Back off before checkout retry
        if: steps.checkout_try1.outcome == 'failure'
        run: sleep 10
      - name: Checkout retry
        id: checkout_try2
        if: steps.checkout_try1.outcome == 'failure'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        continue-on-error: true
        with:
          persist-credentials: 'false'
          fetch-depth: 1
      - name: Back off before the last checkout retry
        if: steps.checkout_try1.outcome == 'failure' && steps.checkout_try2.outcome == 'failure'
        run: sleep 20
      - name: Checkout last retry
        if: steps.checkout_try1.outcome == 'failure' && steps.checkout_try2.outcome == 'failure'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: 'false'
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          pattern: appunit-failures-*
          path: appunit-shards
          merge-multiple: true
      - name: Compare shard failures with baseline
        id: gate
        run: |
          set -euo pipefail
          shopt -s nullglob
          args=()
          statuses=(appunit-shards/appunit-*-status.txt)
          failures=(appunit-shards/appunit-*-failures.txt)
          if [ ${#statuses[@]} -eq 0 ] || [ ${#failures[@]} -eq 0 ]; then
            echo "AppUnit shard name files were not downloaded"
            exit 1
          fi
          for path in "${statuses[@]}"; do args+=(--status "$path"); done
          for path in "${failures[@]}"; do args+=(--failures "$path"); done
          python3 -B .github/acceptance_support.py gate --mode "$ACCEPTANCE_MODE" --baseline docs/release/baselines/appunit.txt --record baseline-appunit.txt --expected-statuses 4 "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ steps.gate.outcome == 'success' && env.ACCEPTANCE_MODE == 'record' }}
        with:
          name: baseline-appunit.txt
          path: baseline-appunit.txt
          if-no-files-found: error

  screenshot-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
    steps:
      - name: Checkout
        id: checkout_try1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        continue-on-error: true
        with:
          persist-credentials: 'false'
          fetch-depth: 1
      - name: Back off before checkout retry
        if: steps.checkout_try1.outcome == 'failure'
        run: sleep 10
      - name: Checkout retry
        id: checkout_try2
        if: steps.checkout_try1.outcome == 'failure'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        continue-on-error: true
        with:
          persist-credentials: 'false'
          fetch-depth: 1
      - name: Back off before the last checkout retry
        if: steps.checkout_try1.outcome == 'failure' && steps.checkout_try2.outcome == 'failure'
        run: sleep 20
      - name: Checkout last retry
        if: steps.checkout_try1.outcome == 'failure' && steps.checkout_try2.outcome == 'failure'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: 'false'
          fetch-depth: 1
      - name: Look for DEBUG fixture routes
        id: plan
        run: |
          set -euo pipefail
          needed="$(python3 -B .github/acceptance_support.py screenshot-needed)"
          echo "needed=${needed}" >> "$GITHUB_OUTPUT"
          echo "screenshot needed: ${needed}"

  ui-smoke-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
    steps:
      - name: Checkout
        id: checkout_try1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        continue-on-error: true
        with:
          persist-credentials: 'false'
          fetch-depth: 1
      - name: Back off before checkout retry
        if: steps.checkout_try1.outcome == 'failure'
        run: sleep 10
      - name: Checkout retry
        id: checkout_try2
        if: steps.checkout_try1.outcome == 'failure'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        continue-on-error: true
        with:
          persist-credentials: 'false'
          fetch-depth: 1
      - name: Back off before the last checkout retry
        if: steps.checkout_try1.outcome == 'failure' && steps.checkout_try2.outcome == 'failure'
        run: sleep 20
      - name: Checkout last retry
        if: steps.checkout_try1.outcome == 'failure' && steps.checkout_try2.outcome == 'failure'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: 'false'
          fetch-depth: 1
      - name: Look for Accept XCUITests
        id: plan
        run: |
          set -euo pipefail
          needed="$(python3 -B .github/acceptance_support.py ui-smoke-needed)"
          echo "needed=${needed}" >> "$GITHUB_OUTPUT"
          echo "ui-smoke needed: ${needed}"

  screenshots:
    needs: [screenshot-plan, debug-build, appunit-lane-w2]
    if: ${{ always() && !cancelled() && needs.screenshot-plan.outputs.needed == 'true' && needs.debug-build.result == 'success' }}
    runs-on: [self-hosted, macOS, ARM64, chengyin-app]
    concurrency:
      group: acceptance-shots-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 50
    steps:
      - name: Checkout
        id: checkout_try1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        continue-on-error: true
        with:
          persist-credentials: 'false'
          fetch-depth: 1
      - name: Back off before checkout retry
        if: steps.checkout_try1.outcome == 'failure'
        run: sleep 10
      - name: Checkout retry
        id: checkout_try2
        if: steps.checkout_try1.outcome == 'failure'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        continue-on-error: true
        with:
          persist-credentials: 'false'
          fetch-depth: 1
      - name: Back off before the last checkout retry
        if: steps.checkout_try1.outcome == 'failure' && steps.checkout_try2.outcome == 'failure'
        run: sleep 20
      - name: Checkout last retry
        if: steps.checkout_try1.outcome == 'failure' && steps.checkout_try2.outcome == 'failure'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: 'false'
          fetch-depth: 1
      - name: Print Xcode version
        run: xcodebuild -version
      - name: Restore DerivedData
        run: python3 -B .github/acceptance_support.py restore-derived --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --dest "$RUNNER_TEMP/derived-shots"
      - name: Simulator destination
        run: python3 -B .github/acceptance_support.py destination --lane w2 --out simulator-destination.txt
      - name: Launch DEBUG fixtures and screenshot
        run: python3 -B .github/acceptance_support.py screenshots --destination-file simulator-destination.txt --derived "$RUNNER_TEMP/derived-shots" --out acceptance-shots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: acceptance-screenshots
          path: acceptance-shots
          if-no-files-found: ignore

  ui-smoke:
    needs: [ui-smoke-plan, debug-build, appunit-lane-lane2]
    if: ${{ always() && !cancelled() && needs.ui-smoke-plan.outputs.needed == 'true' && needs.debug-build.result == 'success' }}
    runs-on: [self-hosted, macOS, ARM64, chengyin-app]
    concurrency:
      group: acceptance-ui-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 50
    steps:
      - name: Checkout
        id: checkout_try1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        continue-on-error: true
        with:
          persist-credentials: 'false'
          fetch-depth: 1
      - name: Back off before checkout retry
        if: steps.checkout_try1.outcome == 'failure'
        run: sleep 10
      - name: Checkout retry
        id: checkout_try2
        if: steps.checkout_try1.outcome == 'failure'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        continue-on-error: true
        with:
          persist-credentials: 'false'
          fetch-depth: 1
      - name: Back off before the last checkout retry
        if: steps.checkout_try1.outcome == 'failure' && steps.checkout_try2.outcome == 'failure'
        run: sleep 20
      - name: Checkout last retry
        if: steps.checkout_try1.outcome == 'failure' && steps.checkout_try2.outcome == 'failure'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: 'false'
          fetch-depth: 1
      - name: Print Xcode version
        run: xcodebuild -version
      - name: Restore DerivedData
        run: python3 -B .github/acceptance_support.py restore-derived --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --dest "$RUNNER_TEMP/derived-ui"
      - name: Select Accept XCUITests
        run: python3 -B .github/acceptance_support.py ui-smoke-args --out ui-smoke-only-testing.args
      - name: Simulator destination
        run: python3 -B .github/acceptance_support.py destination --lane lane2 --out simulator-destination.txt
      - name: Run Accept XCUITests
        run: |
          set -euo pipefail
          set -o pipefail
          dest="$(tr -d '\n' < simulator-destination.txt)"
          run="$(python3 -B .github/acceptance_support.py xctestrun --derived "$RUNNER_TEMP/derived-ui")"
          read -r -a only <<< "$(tr -d '\n' < ui-smoke-only-testing.args)"
          test "${#only[@]}" -gt 0
          python3 -B .github/acceptance_support.py simulator-lock -- xcodebuild test-without-building -xctestrun "$run" -destination "$dest" -resultBundlePath ui-smoke.xcresult -parallel-testing-enabled NO -skip-testing:QuestifyAppUnitTests "${only[@]}" | tee ui-smoke.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        continue-on-error: true
        with:
          name: ui-smoke
          path: |
            ui-smoke.log
            ui-smoke.xcresult
          if-no-files-found: ignore

  record-baselines:
    needs: [gates, core-tests, appunit-baseline]
    if: ${{ !cancelled() && github.ref == 'refs/heads/ci/baseline-record' && needs.gates.result == 'success' && needs.core-tests.result == 'success' && needs.appunit-baseline.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - name: Checkout
        id: checkout_try1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        continue-on-error: true
        with:
          persist-credentials: 'true'
          fetch-depth: 1
          ref: ci/acceptance
      - name: Back off before checkout retry
        if: steps.checkout_try1.outcome == 'failure'
        run: sleep 10
      - name: Checkout retry
        id: checkout_try2
        if: steps.checkout_try1.outcome == 'failure'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        continue-on-error: true
        with:
          persist-credentials: 'true'
          fetch-depth: 1
          ref: ci/acceptance
      - name: Back off before the last checkout retry
        if: steps.checkout_try1.outcome == 'failure' && steps.checkout_try2.outcome == 'failure'
        run: sleep 20
      - name: Checkout last retry
        if: steps.checkout_try1.outcome == 'failure' && steps.checkout_try2.outcome == 'failure'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: 'true'
          fetch-depth: 1
          ref: ci/acceptance
      - name: Acceptance mode
        run: echo "ACCEPTANCE_MODE=$ACCEPTANCE_MODE ref=$GITHUB_REF"
      - uses: actions/download-artifact@v4
        with:
          name: baseline-core.txt
          path: recorded-core
      - uses: actions/download-artifact@v4
        with:
          name: baseline-appunit.txt
          path: recorded-appunit
      - name: Commit baselines to ci/acceptance
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/ci/baseline-record"
          test "$ACCEPTANCE_MODE" = "record"
          url="$(git remote get-url origin)"
          case "$url" in
            *github.com/liboyang42-cpu/chengyin-app|*github.com:liboyang42-cpu/chengyin-app*) ;;
            *) echo "origin is not liboyang42-cpu/chengyin-app"; exit 1 ;;
          esac
          unset url
          python3 -B .github/acceptance_support.py git-retry --ref refs/heads/ci/acceptance
          mkdir -p docs/release/baselines
          cp recorded-core/baseline-core.txt docs/release/baselines/core.txt
          cp recorded-appunit/baseline-appunit.txt docs/release/baselines/appunit.txt
          python3 -B .github/acceptance_support.py record-contract --baseline docs/release/contract-failing-baseline.txt
          git add -- docs/release/baselines/core.txt docs/release/baselines/appunit.txt docs/release/contract-failing-baseline.txt
          set +e
          python3 - << 'PY'
          import subprocess
          import sys
          allowed = {
              "docs/release/baselines/core.txt",
              "docs/release/baselines/appunit.txt",
              "docs/release/contract-failing-baseline.txt",
          }
          staged = subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).split()
          unstaged = subprocess.check_output(["git", "diff", "--name-only"], text=True).split()
          if unstaged:
              sys.exit("unexpected unstaged changes: " + " ".join(unstaged))
          bad = [name for name in staged if name not in allowed]
          if bad:
              sys.exit("refusing to commit: " + " ".join(bad))
          if not staged:
              print("acceptance: baselines already match ci/acceptance; not committing")
              sys.exit(2)
          print("committing " + ", ".join(staged))
          PY
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "acceptance: no baseline commit"
            exit 0
          fi
          test "$code" -eq 0
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "$(cat <<'EOF'
          ci: record Core, AppUnit, and contract baselines

          Observed failing names from the ci/baseline-record run.
          The contract ratchet baseline adds only the known paid-professional failure.

          Co-Authored-By: Cursor <cursoragent@cursor.com>
          EOF
          )"
          git push origin HEAD:refs/heads/ci/acceptance
          echo "pushed $(git rev-parse HEAD) to ci/acceptance"
