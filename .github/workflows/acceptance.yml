name: Acceptance
on:
  push:
    branches:
      - 'port/**'
      - ui/combined-r7
      - ci/acceptance
      - ci/baseline-record
permissions:
  contents: read
env:
  ACCEPTANCE_MODE: ${{ github.ref == 'refs/heads/ci/baseline-record' && 'record' || 'check' }}
jobs:
  baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Acceptance mode
        run: echo "ACCEPTANCE_MODE=$ACCEPTANCE_MODE ref=$GITHUB_REF"
      - name: Check mode requires baseline files
        run: |
          set -euo pipefail
          if [ "$ACCEPTANCE_MODE" != "check" ]; then
            echo "record mode: a missing baseline is not a failure"
            exit 0
          fi
          missing=0
          for path in docs/release/baselines/core.txt docs/release/baselines/appunit.txt; do
            if [ ! -f "$path" ]; then
              echo "baseline missing: $path"
              missing=1
            fi
          done
          exit "$missing"

  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Acceptance mode
        run: echo "ACCEPTANCE_MODE=$ACCEPTANCE_MODE ref=$GITHUB_REF"
      - name: Scaffold
        run: python3 -B tools/check_scaffold.py
      - name: Typography lint
        run: python3 -B tools/check_typography_lint.py
      - name: Record the known contract-ratchet failure
        if: env.ACCEPTANCE_MODE == 'record'
        run: python3 -B .github/acceptance_support.py record-contract --baseline docs/release/contract-failing-baseline.txt
      - name: Contract ratchet
        run: python3 -B tools/contract_ratchet.py --check

  debug-build:
    runs-on: [self-hosted, macOS, ARM64, chengyin-app]
    concurrency:
      group: acceptance-mac
      cancel-in-progress: false
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: DerivedData
          key: acceptance-debug-${{ hashFiles('Questify.xcodeproj/project.pbxproj', 'Package.swift') }}
      - name: Print Xcode version
        run: xcodebuild -version
      - name: Simulator destination
        run: python3 -B .github/acceptance_support.py destination --out simulator-destination.txt
      - name: Debug simulator build
        run: |
          set -o pipefail
          dest="$(tr -d '\n' < simulator-destination.txt)"
          xcodebuild -project Questify.xcodeproj -scheme Questify -configuration Debug -sdk iphonesimulator -destination "$dest" -derivedDataPath DerivedData -resultBundlePath debug-build.xcresult CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build | tee debug-build.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: debug-build
          path: |
            debug-build.log
            debug-build.xcresult
          if-no-files-found: ignore

  core-tests:
    needs: baselines
    runs-on: [self-hosted, macOS, ARM64, chengyin-app]
    concurrency:
      group: acceptance-mac
      cancel-in-progress: false
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Print Xcode version
        run: xcodebuild -version
      - name: Core package tests
        run: |
          set -euo pipefail
          set +e
          swift test --package-path . 2>&1 | tee core-tests.log
          code="${PIPESTATUS[0]}"
          set -e
          echo "$code" > core-exit.txt
          exit 0
      - name: Collect failing names
        id: collect
        if: always()
        run: python3 -B .github/acceptance_support.py collect --log core-tests.log --exit core-exit.txt --failures-out core-failures.txt --status-out core-status.txt
      - name: Compare with baseline
        id: gate
        if: steps.collect.outcome == 'success'
        run: python3 -B .github/acceptance_support.py gate --mode "$ACCEPTANCE_MODE" --baseline docs/release/baselines/core.txt --failures core-failures.txt --status core-status.txt --record baseline-core.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-tests-log
          path: |
            core-tests.log
            core-failures.txt
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ steps.gate.outcome == 'success' && env.ACCEPTANCE_MODE == 'record' }}
        with:
          name: baseline-core.txt
          path: baseline-core.txt
          if-no-files-found: error

  appunit:
    needs: baselines
    runs-on: [self-hosted, macOS, ARM64, chengyin-app]
    concurrency:
      group: acceptance-mac
      cancel-in-progress: false
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: DerivedData
          key: acceptance-appunit-${{ matrix.shard }}-${{ hashFiles('Questify.xcodeproj/project.pbxproj') }}
      - name: Print Xcode version
        run: xcodebuild -version
      - name: Simulator destination
        run: python3 -B .github/acceptance_support.py destination --out simulator-destination.txt
      - name: AppUnit shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 -B .github/acceptance_support.py only-testing --shard "$SHARD" > only-testing.args
          dest="$(tr -d '\n' < simulator-destination.txt)"
          set +e
          xcodebuild -project Questify.xcodeproj -scheme QuestifyAppUnitTests -configuration Debug -sdk iphonesimulator -destination "$dest" -derivedDataPath DerivedData -resultBundlePath "appunit-${SHARD}.xcresult" CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES test $(cat only-testing.args) | tee "appunit-${SHARD}.log"
          code="${PIPESTATUS[0]}"
          set -e
          echo "$code" > "appunit-${SHARD}-exit.txt"
          exit 0
      - name: Collect failing names
        id: collect
        if: always()
        run: python3 -B .github/acceptance_support.py collect --log "appunit-${{ matrix.shard }}.log" --exit "appunit-${{ matrix.shard }}-exit.txt" --failures-out "appunit-${{ matrix.shard }}-failures.txt" --status-out "appunit-${{ matrix.shard }}-status.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: appunit-shard-${{ matrix.shard }}
          path: |
            appunit-${{ matrix.shard }}.log
            appunit-${{ matrix.shard }}.xcresult
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: appunit-failures-${{ matrix.shard }}
          path: |
            appunit-${{ matrix.shard }}-failures.txt
            appunit-${{ matrix.shard }}-status.txt
          if-no-files-found: error

  appunit-baseline:
    needs: appunit
    if: ${{ always() && !cancelled() && needs.appunit.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: appunit-failures-*
          path: appunit-shards
          merge-multiple: true
      - name: Compare shard failures with baseline
        id: gate
        run: |
          set -euo pipefail
          shopt -s nullglob
          args=()
          statuses=(appunit-shards/appunit-*-status.txt)
          failures=(appunit-shards/appunit-*-failures.txt)
          if [ ${#statuses[@]} -eq 0 ]; then
            echo "no AppUnit shard status files were downloaded"
            exit 1
          fi
          for path in "${statuses[@]}"; do args+=(--status "$path"); done
          for path in "${failures[@]}"; do args+=(--failures "$path"); done
          python3 -B .github/acceptance_support.py gate --mode "$ACCEPTANCE_MODE" --baseline docs/release/baselines/appunit.txt --record baseline-appunit.txt --expected-statuses 4 "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ steps.gate.outcome == 'success' && env.ACCEPTANCE_MODE == 'record' }}
        with:
          name: baseline-appunit.txt
          path: baseline-appunit.txt
          if-no-files-found: error

  screenshot-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Look for DEBUG fixture routes
        id: plan
        run: |
          set -euo pipefail
          needed="$(python3 -B .github/acceptance_support.py screenshot-needed)"
          echo "needed=${needed}" >> "$GITHUB_OUTPUT"
          echo "screenshot needed: ${needed}"

  screenshots:
    needs: screenshot-plan
    if: needs.screenshot-plan.outputs.needed == 'true'
    runs-on: [self-hosted, macOS, ARM64, chengyin-app]
    concurrency:
      group: acceptance-mac
      cancel-in-progress: false
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Print Xcode version
        run: xcodebuild -version
      - name: Simulator destination
        run: python3 -B .github/acceptance_support.py destination --out simulator-destination.txt
      - name: Launch DEBUG fixtures and screenshot
        run: python3 -B .github/acceptance_support.py screenshots --destination-file simulator-destination.txt --out acceptance-shots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: acceptance-screenshots
          path: acceptance-shots
          if-no-files-found: ignore

  ui-smoke:
    runs-on: [self-hosted, macOS, ARM64, chengyin-app]
    concurrency:
      group: acceptance-mac
      cancel-in-progress: false
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Print Xcode version
        run: xcodebuild -version
      - name: Select Accept XCUITests
        id: select
        run: |
          set -euo pipefail
          needed="$(python3 -B .github/acceptance_support.py ui-smoke-needed)"
          echo "needed=${needed}" >> "$GITHUB_OUTPUT"
          if [ "$needed" != "true" ]; then
            echo "Tests/AppUITests/Accept is absent or has no XCTestCase; skipping UI smoke"
            exit 0
          fi
          python3 -B .github/acceptance_support.py ui-smoke-args --out ui-smoke-only-testing.args
      - name: Simulator destination
        if: steps.select.outputs.needed == 'true'
        run: python3 -B .github/acceptance_support.py destination --out simulator-destination.txt
      - name: Run Accept XCUITests
        if: steps.select.outputs.needed == 'true'
        run: |
          set -euo pipefail
          set -o pipefail
          dest="$(tr -d '\n' < simulator-destination.txt)"
          read -r -a only <<< "$(tr -d '\n' < ui-smoke-only-testing.args)"
          test "${#only[@]}" -gt 0
          xcodebuild -project Questify.xcodeproj -scheme Questify -configuration Debug -sdk iphonesimulator -destination "$dest" -derivedDataPath DerivedData -resultBundlePath ui-smoke.xcresult CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES test -skip-testing:QuestifyAppUnitTests "${only[@]}" | tee ui-smoke.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ui-smoke
          path: |
            ui-smoke.log
            ui-smoke.xcresult
          if-no-files-found: ignore

  record-baselines:
    needs: [gates, core-tests, appunit-baseline]
    if: ${{ github.ref == 'refs/heads/ci/baseline-record' && needs.gates.result == 'success' && needs.core-tests.result == 'success' && needs.appunit-baseline.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ci/acceptance
          persist-credentials: true
          fetch-depth: 1
      - name: Acceptance mode
        run: echo "ACCEPTANCE_MODE=$ACCEPTANCE_MODE ref=$GITHUB_REF"
      - uses: actions/download-artifact@v4
        with:
          name: baseline-core.txt
          path: recorded-core
      - uses: actions/download-artifact@v4
        with:
          name: baseline-appunit.txt
          path: recorded-appunit
      - name: Commit baselines to ci/acceptance
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/ci/baseline-record"
          test "$ACCEPTANCE_MODE" = "record"
          url="$(git remote get-url origin)"
          case "$url" in
            *github.com/liboyang42-cpu/chengyin-app|*github.com:liboyang42-cpu/chengyin-app*) ;;
            *) echo "origin is not liboyang42-cpu/chengyin-app"; exit 1 ;;
          esac
          unset url
          git fetch origin refs/heads/ci/acceptance
          git checkout --detach FETCH_HEAD
          mkdir -p docs/release/baselines
          cp recorded-core/baseline-core.txt docs/release/baselines/core.txt
          cp recorded-appunit/baseline-appunit.txt docs/release/baselines/appunit.txt
          python3 -B .github/acceptance_support.py record-contract --baseline docs/release/contract-failing-baseline.txt
          git add -- docs/release/baselines/core.txt docs/release/baselines/appunit.txt docs/release/contract-failing-baseline.txt
          set +e
          python3 - << 'PY'
          import subprocess
          import sys
          allowed = {
              "docs/release/baselines/core.txt",
              "docs/release/baselines/appunit.txt",
              "docs/release/contract-failing-baseline.txt",
          }
          staged = subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).split()
          unstaged = subprocess.check_output(["git", "diff", "--name-only"], text=True).split()
          if unstaged:
              sys.exit("unexpected unstaged changes: " + " ".join(unstaged))
          bad = [name for name in staged if name not in allowed]
          if bad:
              sys.exit("refusing to commit: " + " ".join(bad))
          if not staged:
              print("acceptance: baselines already match ci/acceptance; not committing")
              sys.exit(2)
          print("committing " + ", ".join(staged))
          PY
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "acceptance: no baseline commit"
            exit 0
          fi
          test "$code" -eq 0
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "$(cat <<'EOF'
          ci: record Core, AppUnit, and contract baselines

          Observed failing names from the ci/baseline-record run.
          The contract ratchet baseline adds only the known paid-professional failure.

          Co-Authored-By: Cursor <cursoragent@cursor.com>
          EOF
          )"
          git push origin HEAD:refs/heads/ci/acceptance
          echo "pushed $(git rev-parse HEAD) to ci/acceptance"
